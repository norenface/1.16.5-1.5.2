plugins {
    id 'java'
}

group = 'com.tss'
version = '1.0.0'
description = 'TSS PC Mod for Minecraft 1.5.2'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Stub sources (Minecraft/Forge API stubs for compilation only)
sourceSets {
    stub {
        java {
            srcDirs = ['stubs']
        }
    }
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
        compileClasspath += sourceSets.stub.output
    }
}

// Compile stubs first, then main sources
compileJava.dependsOn compileStubJava

// Patch class file version from Java 8 (52) to Java 7 (51) for ASM 4.1 compatibility
task patchClassVersion {
    dependsOn compileJava
    doLast {
        fileTree(dir: sourceSets.main.output.classesDirs.first(), include: '**/*.class').each { File classFile ->
            byte[] bytes = classFile.bytes
            if (bytes.length >= 8
                    && (bytes[0] & 0xFF) == 0xCA && (bytes[1] & 0xFF) == 0xFE
                    && (bytes[2] & 0xFF) == 0xBA && (bytes[3] & 0xFF) == 0xBE) {
                // Java 8 = major version 52 (0x34); downgrade to Java 7 = 51 (0x33)
                if (bytes[6] == 0 && (bytes[7] & 0xFF) == 52) {
                    bytes[7] = 51
                    classFile.bytes = bytes
                }
            }
        }
        println "Patched class files to Java 7 bytecode version"
    }
}

// Build the mod JAR (only includes mod classes, not stubs)
jar {
    dependsOn patchClassVersion
    archiveBaseName = 'com_tss_pc'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    // Include resources (mcmod.info, textures, etc.)
    from(sourceSets.main.resources.srcDirs) {
        include '**/*'
    }
    manifest {
        attributes(
            'FMLCorePlugin': 'com.tss.pc.TSSPCMod',
            'Mod-Version': project.version
        )
    }
}

// Build stub JAR separately (for development use)
task stubsJar(type: Jar) {
    archiveBaseName = 'mc-stubs'
    archiveVersion = '1.5.2'
    from sourceSets.stub.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
